name: Check

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    env:
      BUILD_IMAGE: ghcr.io/jeffreybergier/altivec-intelligence:latest

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull latest build image
        run: docker pull "$BUILD_IMAGE"

      - name: Provision pinned EJS resources
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'python3 /altivec/make/build.py safe-root "$PWD" "$PWD/build" && python3 .github/scripts/provision-ejs.py build/generated/ejs'

      - name: Run offline Linux tests
        run: |
          docker run --rm --network none \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'make -j2 test && make sanitize'
